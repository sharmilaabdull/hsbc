<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Capita - Trade Stocks</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom right, #000000, #000428, #001f33);
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 80px auto;
      padding: 20px;
      background: rgba(15, 15, 15, 0.9);
      border-radius: 15px;
      box-shadow: 0 0 25px #00bfff30;
    }

    h2 {
      text-align: center;
      color: #00ffcc;
      margin-bottom: 30px;
      text-shadow: 0 0 10px #00bfff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border: 1px solid #00ffcc30;
    }

    th {
      color: #00ffcc;
      background: #1a1a1a;
    }

    td input[type=number] {
      width: 60px;
      padding: 5px;
      background: #222;
      color: #fff;
      border: 1px solid #00ffcc80;
      border-radius: 4px;
    }

    .action-btn {
      padding: 6px 12px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 0 4px;
      transition: 0.2s ease;
    }

    .buy-btn {
      background: #00ffcc;
      color: #0f0f0f;
    }

    .buy-btn:hover {
      background: #00ffaa;
    }

    .sell-btn {
      background: #ff6666;
      color: #fff;
    }

    .sell-btn:hover {
      background: #ff9999;
    }

    .confirmation {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
      color: #00ffaa;
    }

    .sell-confirmation {
      color: #ffcc00;
    }
  </style>
</head>
<body>
  <canvas id="graph-bg"></canvas>

  <div class="container">
    <h2>Buy / Sell Stocks</h2>
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Symbol</th>
          <th>Current Price</th>
          <th>Qty</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tradeTable">
        <!-- Rows will be populated dynamically -->
      </tbody>
    </table>
    <div id="confirmation" class="confirmation"></div>
  </div>

  <script>
    // Canvas BG animation
    const canvas = document.getElementById("graph-bg");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let points = [];
    let spacing = 100;

    for (let x = 0; x < canvas.width + spacing; x += spacing) {
      let y = canvas.height / 2 + Math.random() * 100 - 50;
      points.push({ x, y });
    }

    function drawGraph() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00bfff';
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function animate() {
      for (let i = 0; i < points.length; i++) {
        points[i].y += Math.random() * 4 - 2;
        points[i].x -= 0.5;
        if (points[i].x < -spacing) {
          points[i].x = canvas.width;
          points[i].y = canvas.height / 2 + Math.random() * 100 - 50;
        }
      }
      drawGraph();
      requestAnimationFrame(animate);
    }

    animate();

    // ------------------------------
    // Trade Logic (Buy + Sell Combo)
    // ------------------------------
    const companies = [
      { id: 1, name: "Reliance", stock_symbol: "RELIANCE", current_price: 2700 },
      { id: 2, name: "Infosys", stock_symbol: "INFY", current_price: 1400 },
      { id: 3, name: "Tata Motors", stock_symbol: "TATAMOTORS", current_price: 780 }
    ];

    const ownedStocks = {
      "RELIANCE": 10,
      "INFY": 5,
      "TATAMOTORS": 3
    };

    const tradeTable = document.getElementById("tradeTable");
    const confirmation = document.getElementById("confirmation");

    companies.forEach((company, index) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${company.name}</td>
        <td>${company.stock_symbol}</td>
        <td>₹${company.current_price}</td>
        <td><input type="number" id="qty-${index}" min="1" /></td>
        <td>
          <button class="action-btn buy-btn" onclick="buyStock(${index})">Buy</button>
          <button class="action-btn sell-btn" onclick="sellStock(${index})">Sell</button>
        </td>
      `;
      tradeTable.appendChild(row);
    });

    function buyStock(index) {
      const qtyInput = document.getElementById(`qty-${index}`);
      const qty = parseInt(qtyInput.value);
      const company = companies[index];

      if (!qty || qty <= 0) {
        alert("Enter a valid quantity to buy.");
        return;
      }

      const total = qty * company.current_price;
      confirmation.innerText = `✔️ Bought ${qty} shares of ${company.stock_symbol} for ₹${total.toLocaleString()}`;
      confirmation.className = "confirmation";
    }

    function sellStock(index) {
      const qtyInput = document.getElementById(`qty-${index}`);
      const qty = parseInt(qtyInput.value);
      const company = companies[index];
      const ownedQty = ownedStocks[company.stock_symbol] || 0;

      if (!qty || qty <= 0 || qty > ownedQty) {
        alert(`You can sell up to ${ownedQty} shares of ${company.stock_symbol}`);
        return;
      }

      const total = qty * company.current_price;
      confirmation.innerText = `✔️ Sold ${qty} shares of ${company.stock_symbol} for ₹${total.toLocaleString()}`;
      confirmation.className = "confirmation sell-confirmation";
    }
  </script>
</body>
</html>
